function openDrw(o){const x=rowsFor(o);if(!x)return;const v=cnt(x.rs);let cur=null;
 let h=`<button class="x" onclick="closeDrw()">✕</button><div class="no">${x.no}</div><h3>${esc(x.j)}</h3><div class="sm">${v[0]+v[1]} dari ${x.rs.length} dokumen ada · ${v[0]} lengkap · klik dokumen untuk membuka</div>`;
 x.rs.forEach(r=>{const s=subOf(r.id);if(o.startsWith("t:")&&s&&s!==cur){cur=s;h+=`<div class="sg">${SUB[s]}</div>`}
  h+=`<div class="dr ${r.f.length?"f":""}" data-v="${r.id}"><span class="ic ${r.k}">${IC[r.k]}</span><b>${esc(r.j)}</b><span class="t">${dateCell(r)}</span><small>${esc(r.n||"")}</small></div>`});
 const d=document.getElementById("drw");d.innerHTML=h;d.style.display="block";document.getElementById("dim").style.display="block";d.scrollTop=0}
function closeDrw(){document.getElementById("drw").style.display="none";document.getElementById("dim").style.display="none"}

// ---------------- daftar seluruh dokumen ----------------
const ROM={"1":"I","2":"II","3":"III","4":"IV","5":"V"};
function daftar(){const rs=ROWS.filter(r=>ROM[r.id.split(".")[0]]),v=cnt(rs);let body="",cur=null,cs=null,n=0,si=0;
 rs.forEach(r=>{const t=r.id.split(".")[0];if(t!==cur){cur=t;cs=null;n=0;si=0;body+=`<tr class="tgr"><td style="text-align:center">${ROM[t]}</td><td colspan="4">${TH[+t-1][1]}</td></tr>`}
  const s=subOf(r.id);if(s&&s!==cs){cs=s;n=0;body+=`<tr class="sb"><td></td><td colspan="4">${"ABCDEFGHI"[si++]}. ${SUB[s]}</td></tr>`}
  n++;body+=`<tr class="${r.f.length?"f":""}" data-v="${r.id}"><td class="nr">${n}</td><td class="dk">${esc(r.j)}</td><td class="cc"><span class="ic ${r.k}">${IC[r.k]}</span></td><td class="tl">${dateCell(r)}</td><td class="kt2">${esc(r.n||"")}</td></tr>`});
 document.getElementById("daf").innerHTML=`<div class="dh"><div><h1>Daftar Seluruh Dokumen</h1><p>Tahap I – V (Pra Lelang s.d. PHO) · ${rs.length} dokumen · klik nama dokumen untuk membuka</p></div>
 <div class="sc"><div><b>${v[0]}</b><span>Lengkap</span></div><div><b>${v[1]}</b><span>Perlu perbaikan</span></div><div><b>${v[2]}</b><span>Tidak ada</span></div></div>
 <div style="display:flex;gap:10px"><button class="btn" onclick="ekspor()">Ekspor isian (CSV)</button><button class="btn" onclick="tutupDaftar()">‹ Kembali ke Alur Tahapan</button></div></div>
 <div class="wr"><div class="lg"><span><i class="ic ok">✓</i>Ada, lengkap</span><span><i class="ic fix">✓</i>Ada, perlu perbaikan</span><span><i class="ic no">✕</i>Tidak ada</span><span><i class="kk" style="position:static"></i>Tanggal kosong, klik untuk mengisi</span></div>
 <table><tr><th style="text-align:center">No</th><th>Tahap / Dokumen</th><th style="text-align:center">Ada / Tidak</th><th>Tanggal</th><th>Keterangan</th></tr>${body}</table></div>`;
 const d=document.getElementById("daf");d.style.display="block";d.scrollTop=0}
function tutupDaftar(){document.getElementById("daf").style.display="none"}
function ekspor(){const q=s=>'"'+String(s==null?"":s).replace(/"/g,'""')+'"';let c=["No","Tahap","Dokumen","Ada/Tidak","Status","Tanggal","Tanggal diisi saat rapat","Keterangan"].map(q).join(";")+"\n";
 ROWS.forEach(r=>{const t=r.id.split(".")[0];c+=[r.id,TH[+t-1][1],r.j,r.k==="no"?"Tidak":"Ada",{ok:"Lengkap",fix:"Perlu perbaikan",no:"Tidak ada"}[r.k],fmt(r.d),fmt(S["d:"+r.id]||""),r.n].map(q).join(";")+"\n"});
 c+="\n"+q("Tanggal tahap / adendum diisi saat rapat")+"\n";Object.keys(S).filter(k=>!k.startsWith("d:")).forEach(k=>c+=q(k)+";"+q(fmt(S[k]))+"\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+c],{type:"text/csv"}));a.download="isian_rapat_praPHO_ditreskrimsus.csv";a.click()}

// ---------------- penampil dokumen ----------------
function openVw(id){const r=R[id];if(!r||!r.f.length)return;let i=0;
 const draw=()=>{const[p,pg,lb]=r.f[i],e=p.split(".").pop().toLowerCase(),parts=p.split("/"),fn=parts.pop();let b;
  if(tampil(p)&&e==="pdf")b=`<iframe src="${href(p,pg)}"></iframe>`;
  else if(tampil(p))b=`<img src="${href(p)}" alt="">`;
  else b=`<div class="card"><h4>Dibuka terpisah</h4><p>Dokumen ini dibuka di aplikasinya (Excel / Word / PDF viewer).</p><code>${esc(parts.join(" › "))} ›<br><b>${esc(fn)}</b></code><a href="${href(p)}" target="_blank">Buka file</a></div>`;
  document.getElementById("vw").innerHTML=`<div class="vh"><span class="ic ${r.k}">${IC[r.k]}</span><h3>${esc(r.j)}</h3><button class="x" style="position:static" onclick="closeVw()">✕</button></div>
  ${r.f.length>1?`<div class="tb">${r.f.map((f,j)=>`<button class="${j===i?"on":""}" data-i="${j}">${esc(f[2]||f[0].split("/").pop())}</button>`).join("")}</div>`:""}<div class="bd">${b}</div>`;
  document.querySelectorAll("#vw .tb button").forEach(bt=>bt.onclick=()=>{i=+bt.dataset.i;draw()})};
 draw();document.getElementById("vw").style.display="flex";document.getElementById("vdim").style.display="block"}
function closeVw(){document.getElementById("vw").style.display="none";document.getElementById("vdim").style.display="none";document.getElementById("vw").innerHTML=""}

// ---------------- skala layar & kejadian ----------------
function fit(){const k=document.documentElement.clientWidth/1920;["1","2"].forEach(n=>{document.getElementById("g"+n).style.transform=`scale(${k})`;document.getElementById("s"+n).style.height=1080*k+"px"})}
function render(){screen1();screen2();fit()}
document.addEventListener("click",e=>{if(e.target.closest("input"))return;
 const v=e.target.closest("[data-v]");if(v){openVw(v.dataset.v);return}
 const o=e.target.closest("[data-o]");if(o){o.dataset.o==="daftar"?daftar():openDrw(o.dataset.o)}});
["dim","vdim"].forEach(i=>document.getElementById(i).onclick=()=>{i==="dim"?closeDrw():closeVw()});
document.addEventListener("change",e=>{const t=e.target;if(!t.matches("input.tg"))return;const k=t.dataset.k;if(t.value)S[k]=t.value;else delete S[k];save();
 document.querySelectorAll(`input.tg[data-k="${k}"]`).forEach(x=>{x.value=t.value;x.classList.toggle("isi",!!t.value)});if(k==="ad1"||k==="ad2")screen2()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(document.getElementById("vw").style.display==="flex")closeVw();else if(document.getElementById("drw").style.display==="block")closeDrw();else tutupDaftar()}});
window.addEventListener("resize",fit);render();
</script></body></html>
